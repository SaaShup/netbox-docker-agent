services:
  netbox-docker-agent:
    build: .
    image: saashup/netbox-docker-agent:2
    restart: unless-stopped
    init: true
    ports:
      - "1880:1880"
    environment:
      PORT: "1880"
      DATAPATH: /data
      API_USERNAME: ${API_USERNAME:-admin}
      API_PASSWORD: ${API_PASSWORD:-}
      HEALTHCHECK_PASSWORD: ${HEALTHCHECK_PASSWORD:-saashup}
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - netbox-docker-agent:/data
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  netbox-docker-agent:
